<main class="flex min-h-screen items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="mb-8 text-center">
      <h1 class="font-pixel text-3xl tracking-tighter">Wiski</h1>
      <p class="mt-3 text-xs font-bold text-gray-500 uppercase">Consorcios Transparentes</p>
    </div>

    <form class="brutal-box pixel-corner p-6" novalidate (submit)="ingresar($event)">
      <h2 class="mb-4 border-b-2 border-black pb-2 text-lg font-bold uppercase">Ingresar</h2>

      <label class="mb-4 block">
        <span class="text-xs font-bold text-gray-500 uppercase">Mail</span>
        <input
          type="email"
          autocomplete="username"
          class="brutal-input mt-1"
          [formField]="loginForm.email"
        />
        @if (loginForm.email().touched()) {
          @for (error of loginForm.email().errors(); track error.kind) {
            <span class="mt-1 block text-xs font-bold text-red-600">{{ error.message }}</span>
          }
        }
      </label>

      <label class="mb-6 block">
        <span class="text-xs font-bold text-gray-500 uppercase">Contraseña</span>
        <input
          type="password"
          autocomplete="current-password"
          class="brutal-input mt-1"
          [formField]="loginForm.password"
        />
        @if (loginForm.password().touched()) {
          @for (error of loginForm.password().errors(); track error.kind) {
            <span class="mt-1 block text-xs font-bold text-red-600">{{ error.message }}</span>
          }
        }
      </label>

      @if (errorLogin()) {
        <p class="mb-4 border-2 border-dashed border-black p-2 text-xs font-bold text-red-600">
          No pudimos iniciar sesión. Probá de nuevo.
        </p>
      }

      <button
        type="submit"
        class="brutal-button w-full px-4 py-3 text-sm font-bold tracking-wide uppercase"
        [disabled]="loginForm().submitting()"
      >
        {{ loginForm().submitting() ? 'Ingresando…' : 'Ingresar' }}
      </button>

      <p class="mt-4 text-center text-xs text-gray-500">
        Prototipo: los datos del usuario demo ya están cargados.
      </p>
    </form>
  </div>
</main>
